name: Import transparent homepage hero image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-transparent-hero-once.yml

permissions:
  contents: write

jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download user-provided transparent PNG
        run: |
          curl --fail --show-error --silent --location --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JFN34Qe7I15a2A1mQucztzlTZR/3de05668-84cd-4ade-a504-78b93ad87f1f.png' \
            --output assets/hero-laptop.png
          echo '81d45ef2c15079b3512fdd72b71cd3ab4f0a609a31fa3ba51b7093d5c6babcb6  assets/hero-laptop.png' | sha256sum --check
      - name: Commit the replacement hero image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-laptop.png
          if git diff --cached --quiet; then
            echo 'Hero image already matches.'
          else
            git commit -m "Replace homepage laptop image with user supplied transparent PNG"
            git push origin HEAD:main
          fi
