name: Update visual assets
on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-visual-assets.mjs"
      - ".github/workflows/update-visual-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install --no-save sharp
      - run: node scripts/generate-visual-assets.mjs
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-laptop-960.webp assets/hero-laptop-1600.webp assets/hero-laptop-3840.webp assets/hero-laptop.png assets/hero-laptop.webp assets/royal-tiles.webp assets/royal-tiles.jpg assets/sugumar-portfolio.webp assets/sugumar-portfolio.jpg assets/vip-hunter.webp assets/vip-hunter.jpg assets/deccan-school.webp assets/deccan-school.jpg assets/profile-formal.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update hero image, 3D icons, projects slider and footer icons"
          git push origin HEAD:main
