name: Portfolio quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Static and browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: node --check script.js
      - name: Test portfolio structure and features
        run: node --test tests/smoke.mjs
      - name: Build production output
        run: npm run build
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify desktop and mobile
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/portfolio-server.log 2>&1 &
          sleep 2
          node tests/browser.mjs
      - name: Save real-browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-previews
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
