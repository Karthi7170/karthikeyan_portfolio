name: Rebuild 4K hero from Canva

on:
  push:
    paths:
      - ".github/workflows/canva-hero-4k.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Canva hero source
        env:
          CANVA_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:2160/quality:90/uri:ifs%3A%2F%2FM%2F98afac2c-492b-4bc8-b661-6d2f90f819af/watermark:F/width:3840?csig=AAAAAAAAAAAAAAAAAAAAAMnvKpTKFOuvkC4sWgjQljnX4sNhEQKm8xqLlyFfKufp&exp=1790854440&osig=AAAAAAAAAAAAAAAAAAAAAKX-JfldIYST4JXStnVVHPFwH-4d7sRAqCHnuHC5OZYx&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          curl --fail --location --retry 3 "$CANVA_URL" --output /tmp/hero.jpg
          ls -lh /tmp/hero.jpg

      - name: Convert and verify 4K hero
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageFilter
          img = Image.open("/tmp/hero.jpg").convert("RGB")
          print("Fetched Canva image:", img.size)
          if img.size != (3840, 2160):
              img = img.resize((3840, 2160), Image.Resampling.LANCZOS)
          img = img.filter(ImageFilter.UnsharpMask(radius=0.8, percent=60, threshold=3))
          img.save("assets/hero-laptop-3840.webp", "WEBP", quality=82, method=6)
          check = Image.open("assets/hero-laptop-3840.webp")
          assert check.size == (3840, 2160), check.size
          print("Final hero:", check.size)
          PY

      - name: Commit rebuilt hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-laptop-3840.webp
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild hero image from Canva at 4K"
          git push
